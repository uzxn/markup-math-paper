<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>math-paper-maker</title>
    <script>
      MathJax = {
        output: { font: "mathjax-modern" },
        tex: {
          inlineMath: { "[+]": [["$", "$"]] },
          macros: {
            para: "\\mathrel{/\\negmedspace/}",
            blank: "\\underline{\\quad\\quad\\quad\\quad\\quad}",
          },
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
    <style>
      @font-face {
        font-family: "LatinFont";
        src: url("https://cdn.jsdelivr.net/gh/uzxn/font@master/lmroman10-regular.otf");
        unicode-range: U+0000-007F;
      }
      :root {
        --padding-top-bottom: 20mm;
        --padding-left-right: 24mm;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 210mm;
        height: 297mm;
        margin: 0 auto;
        padding: var(--padding-top-bottom) var(--padding-left-right);
        line-height: 1.8;
        font-family: "LatinFont", FZGFShuSong, serif;
        font-size: 12pt;
      }
      .paper {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .title {
        text-align: center;
        font-family: "LatinFont", FZGFShuSong, serif;
        font-size: 18pt;
      }
      .subject {
        text-align: center;
        font-family: "LatinFont", SimHei, sans-serif;
        font-size: 24pt;
      }
      .chapter,
      .question {
        text-indent: -2em;
        padding-left: 2em;
      }
      .chapter {
        font-family: "LatinFont", SimHei, sans-serif;
      }
      .option-1,
      .option-2,
      .option-4 {
        display: grid;
        text-indent: -1.7em;
        padding-left: 3.7em;
        align-items: baseline;
      }
      .option-1 {
        grid-template-columns: 9em 9em 9em 9em;
      }
      .option-2 {
        grid-template-columns: 18em 18em;
      }
      .option-4 {
        grid-template-columns: 36em;
      }
      @media print {
        @page {
          size: A4;
          margin: 0;
          padding: var(--padding-top-bottom) var(--padding-left-right);
        }
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="paper">[placeholder]</div>
  </body>
</html>
