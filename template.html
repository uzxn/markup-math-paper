<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>math-paper-maker</title>
    <script>
      MathJax = {
        output: { font: "mathjax-modern" },
        tex: {
          inlineMath: { "[+]": [["$", "$"]] },
          macros: {
            para: "\\mathrel{/\\negmedspace/}",
            blank: "\\underline{\\quad\\quad\\quad\\quad\\quad}",
          },
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
    <style>
      @font-face {
        font-family: "LatinFont";
        src: local("Times New Roman");
        unicode-range: U+0000-007F;
      }
      :root {
        --padding-top-bottom: 20mm;
        --padding-left-right: 24mm;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 210mm;
        height: 297mm;
        margin: 0 auto;
        padding: var(--padding-top-bottom) var(--padding-left-right);
        line-height: 1.8;
        font-family: "LatinFont", NSimSun, serif;
        font-size: 12pt;
      }
      .paper {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .title {
        text-align: center;
        font-family: "LatinFont", NSimSun, serif;
        font-size: 18pt;
      }
      .subject {
        text-align: center;
        font-family: "LatinFont", SimHei, sans-serif;
        font-size: 24pt;
      }
      .chapter,
      .question {
        text-indent: -2em;
        padding-left: 2em;
      }
      .chapter {
        font-family: "LatinFont", SimHei, sans-serif;
      }
      .option-1,
      .option-2,
      .option-3,
      .option-4 {
        position: absolute;
      }
      .option-1 {
        left: 2em;
      }
      .option-2 {
        left: 11em;
      }
      .option-3 {
        left: 20em;
      }
      .option-4 {
        left: 29em;
      }
      @media print {
        @page {
          size: A4;
          margin: 0;
          padding: var(--padding-top-bottom) var(--padding-left-right);
        }
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="paper">[placeholder]</div>
  </body>
</html>
